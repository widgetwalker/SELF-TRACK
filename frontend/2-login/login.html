<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>SelfTrack - Login</title>
    <link rel="stylesheet" href="style.css">
    <style>
        .tab-container {
            display: flex;
            border-bottom: 2px solid #e0e0e0;
            margin-bottom: 2rem;
        }

        .tab {
            flex: 1;
            padding: 1rem;
            cursor: pointer;
            text-align: center;
            border-bottom: 3px solid transparent;
            transition: all 0.3s;
            color: #666;
            font-weight: 500;
        }

        .tab.active {
            border-bottom-color: #007bff;
            color: #007bff;
        }

        .tab:hover {
            background-color: #f8f9fa;
        }

        .form-panel {
            display: none;
        }

        .form-panel.active {
            display: block;
        }

        .password-requirements {
            font-size: 0.85rem;
            color: #666;
            margin-top: 0.5rem;
        }

        .role-selector {
            display: flex;
            gap: 1rem;
            margin: 1rem 0;
        }

        .role-option {
            flex: 1;
            padding: 1rem;
            border: 2px solid #e0e0e0;
            border-radius: 4px;
            cursor: pointer;
            text-align: center;
            transition: all 0.3s;
        }

        .role-option:hover {
            border-color: #007bff;
            background-color: #f0f7ff;
        }

        .role-option input[type="radio"] {
            margin-right: 0.5rem;
        }

        .role-option input[type="radio"]:checked ~ span {
            color: #007bff;
            font-weight: 600;
        }
    </style>
</head>

<body style="align-items: center; justify-content: center; min-height: 100vh; padding: 2rem 0;">
    <div class="card" style="width: 400px;">
        <!-- Tabs -->
        <div class="tab-container">
            <div class="tab active" id="login-tab">Login</div>
            <div class="tab" id="signup-tab">Sign Up</div>
        </div>

        <!-- Login Panel -->
        <div class="form-panel active" id="login-panel">
            <form id="login-form">
                <div class="form-group">
                    <label class="form-label">Email</label>
                    <input type="email" id="email" class="form-input" required placeholder="your@email.com">
                </div>
                <div class="form-group">
                    <label class="form-label">Password</label>
                    <input type="password" id="password" class="form-input" required placeholder="Enter password">
                </div>
                <div id="error-message" style="color: red; margin: 1rem 0; display: none;"></div>
                <button type="submit" class="btn-primary" id="login-btn" style="width: 100%;">Login</button>
            </form>
        </div>

        <!-- Signup Panel -->
        <div class="form-panel" id="signup-panel">
            <form id="signup-form">
                <div class="form-group">
                    <label class="form-label">Full Name</label>
                    <input type="text" id="signup-name" class="form-input" required placeholder="John Doe">
                </div>
                <div class="form-group">
                    <label class="form-label">Email</label>
                    <input type="email" id="signup-email" class="form-input" required placeholder="your@email.com">
                </div>
                <div class="form-group">
                    <label class="form-label">Password</label>
                    <input type="password" id="signup-password" class="form-input" required placeholder="Min 6 characters">
                    <div class="password-requirements">Minimum 6 characters</div>
                </div>
                <div class="form-group">
                    <label class="form-label">Confirm Password</label>
                    <input type="password" id="signup-confirm-password" class="form-input" required placeholder="Confirm password">
                </div>
                <div class="form-group">
                    <label class="form-label">Select Role</label>
                    <div class="role-selector">
                        <label class="role-option">
                            <input type="radio" name="role" value="employee" id="role-employee" checked>
                            <span>👤 Employee</span>
                        </label>
                        <label class="role-option">
                            <input type="radio" name="role" value="admin" id="role-admin">
                            <span>👨‍💼 Admin</span>
                        </label>
                    </div>
                </div>
                <input type="hidden" id="signup-role" value="employee">
                <div id="signup-error-message" style="color: red; margin: 1rem 0; display: none;"></div>
                <button type="submit" class="btn-primary" id="signup-btn" style="width: 100%;">Create Account</button>
            </form>
            <script>
                document.querySelectorAll('input[name="role"]').forEach(radio => {
                    radio.addEventListener('change', (e) => {
                        document.getElementById('signup-role').value = e.target.value;
                    });
                });
            </script>
        </div>
    </div>
    <script src="../api-client.js"></script>
    <script src="logsrc.js"></script>
</body>

</html>
