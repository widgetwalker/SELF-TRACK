<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>WorkTrack - Dashboard</title>
    <link rel="stylesheet" href="css/style.css">
    <script src="https://unpkg.com/lucide@latest"></script>
</head>
<body>
    <aside class="sidebar">
        <div class="logo-container">
            <i data-lucide="trending-up"></i>
            <span class="logo-text">WorkTrack</span>
        </div>
        <nav class="nav-group">
            <a href="index.html" class="nav-link active"><i data-lucide="layout-dashboard"></i> Dashboard</a>
            <a href="tasks.html" class="nav-link"><i data-lucide="check-square"></i> Tasks</a>
            <a href="burnout.html" class="nav-link"><i data-lucide="alert-triangle"></i> Burnout</a>
            <a href="salary.html" class="nav-link"><i data-lucide="dollar-sign"></i> Salary</a>
        </nav>
        <div class="sidebar-footer">
            <button id="logout-btn" class="nav-link" style="width: 100%; border: none; background: none; cursor: pointer; color: hsl(var(--destructive));">
                <i data-lucide="log-out"></i> Logout
            </button>
        </div>
    </aside>

    <div class="main-content">
        <header class="header">
            <span class="welcome-text">Welcome back, <span id="display-name">User</span></span>
            <i data-lucide="bell"></i>
        </header>

        <main class="page-body" style="padding: 2rem; display: flex; flex-direction: column; gap: 1.5rem;">
            <div class="stats-grid">
                <div class="card">
                    <p class="muted-label">Task Progress</p>
                    <h2 class="stat-value">65%</h2>
                    <div class="progress-bar-bg" style="height: 6px; background: hsl(var(--muted)); border-radius: 3px;">
                        <div class="progress-bar-fill" style="width: 65%; height: 100%; background: hsl(var(--primary)); border-radius: 3px;"></div>
                    </div>
                </div>
                <div class="card">
                    <p class="muted-label">Hours Worked</p>
                    <h2 class="stat-value">38.5h</h2>
                    <span class="trend-up">+2.4h vs last week</span>
                </div>
                <div class="card">
                    <p class="muted-label">Burnout Risk</p>
                    <h2 class="stat-value" style="color: hsl(var(--success));">Low</h2>
                </div>
            </div>

            <div class="content-grid">
                <section class="card">
                    <h3 class="card-title">Recent Tasks</h3>
                    <div id="task-list-container"></div>
                </section>

                <section class="card">
                    <h3 class="card-title" style="text-align: center;">Productivity Score</h3>
                    <div class="gauge-wrapper">
                        <svg class="gauge-svg" width="160" height="160">
                            <circle class="gauge-bg" cx="80" cy="80" r="70" />
                            <circle id="gauge-path" class="gauge-path" cx="80" cy="80" r="70" stroke-dasharray="440" stroke-dashoffset="88" />
                        </svg>
                        <div class="gauge-text">
                            <span class="gauge-value">80</span>
                        </div>
                    </div>
                </section>
            </div>
        </main>
    </div>

    <script src="js/app.js"></script>
</body>
</html>
