version: '3.8'

services:
  # MongoDB Database
  mongodb:
    image: mongo:7.0
    container_name: selftrack_mongodb
    ports:
      - "27017:27017"
    environment:
      MONGO_INITDB_ROOT_USERNAME: admin
      MONGO_INITDB_ROOT_PASSWORD: admin
    volumes:
      - mongodb_data:/data/db
    networks:
      - selftrack_network
    healthcheck:
      test: echo 'db.runCommand("ping").ok' | mongosh localhost:27017/test --quiet
      interval: 10s
      timeout: 5s
      retries: 5

  # Backend API
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: selftrack_backend
    ports:
      - "5000:5000"
    environment:
      PORT: 5000
      MONGO_URI: mongodb://admin:admin@mongodb:27017/selftrack?authSource=admin
      JWT_SECRET: your-secret-key-change-in-production
      ML_BASE_URL: http://ml-service:8000
      ML_TIMEOUT: 10000
      NODE_ENV: development
    depends_on:
      mongodb:
        condition: service_healthy
    volumes:
      - ./backend:/app
      - /app/node_modules
    networks:
      - selftrack_network
    command: npm run dev

  # ML Service
  ml-service:
    build:
      context: ./backend/ml-service
      dockerfile: Dockerfile
    container_name: selftrack_ml_service
    ports:
      - "8000:8000"
    environment:
      PYTHONUNBUFFERED: 1
    volumes:
      - ./backend/ml-service:/app
    networks:
      - selftrack_network
    command: uvicorn app:app --host 0.0.0.0 --port 8000 --reload
    healthcheck:
      test: curl -f http://localhost:8000/health || exit 1
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  mongodb_data:

networks:
  selftrack_network:
    driver: bridge
